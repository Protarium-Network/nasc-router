	server {
		listen 443 ssl;
		server_name nasc.example.org;

		ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
		ssl_ciphers ALL;
		ssl_prefer_server_ciphers on;
		ssl_certificate /etc/ssl/nasc.example.org.crt;
		ssl_certificate_key /etc/ssl/nasc.example.org.key;

		# 3DS NASC: nasc-router (/opt/nasc-router/nasc-router.js) sends our titles to the local
		# Pretendo account server and everything else to the real nasc.pretendo.cc.
		location / {
			proxy_pass http://127.0.0.1:7070;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto https;
		}
	}

